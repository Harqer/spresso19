type User @table(key: "id") {
  id: String!
  email: String
  displayName: String
  avatarUrl: String
  createdAt: Timestamp! @default(expr: "request.time")
}

type Product @table(key: "id") {
  id: String!
  name: String!
  brand: String!
  category: String!
  price: Float!
  image: String
  description: String
  likesCount: Int! @default(value: 0)
}

type Video @table {
  id: UUID! @default(expr: "uuidV4()")
  userUid: String!
  productId: String
  videoUrl: String!
  videoType: String!
  status: String! @default(value: "READY")
  createdAt: Timestamp! @default(expr: "request.time")
}

type Cart @table {
  id: UUID! @default(expr: "uuidV4()")
  userUid: String! @unique
  updatedAt: Timestamp! @default(expr: "request.time")
}

type CartItem @table {
  id: UUID! @default(expr: "uuidV4()")
  cart: Cart!
  product: Product!
  quantity: Int! @default(value: 1)
  selectedSize: String
  selectedColor: String
  createdAt: Timestamp! @default(expr: "request.time")
}

type Order @table {
  id: UUID! @default(expr: "uuidV4()")
  authorizationId: String!
  userUid: String!
  product: Product!
  quantity: Int!
  totalAmount: Float! @default(value: 0.0)
  shippingAddress: String
  deviceSource: String!
  paymentMethod: String!
  status: String! @default(value: "CONFIRMED")
  userConfirmedToken: String
  createdAt: Timestamp! @default(expr: "request.time")
}

type UserLike @table(key: ["userUid", "product"]) {
  userUid: String!
  product: Product!
  timestamp: Timestamp! @default(expr: "request.time")
}

# ----------------------------------------------------
# META WEARABLES & SPATIAL FEATURES
# ----------------------------------------------------

type GroceryList @table {
  id: UUID! @default(expr: "uuidV4()")
  userId: String!
  title: String!
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type GroceryListItem @table {
  id: UUID! @default(expr: "uuidV4()")
  groceryList: GroceryList!
  productName: String!
  productId: String
  isPurchased: Boolean! @default(value: false)
  addedVia: String!
  createdAt: Timestamp! @default(expr: "request.time")
}

type ActiveCookingSession @table {
  id: UUID! @default(expr: "uuidV4()")
  userId: String!
  recipeId: String!
  currentStepIndex: Int! @default(value: 0)
  startedAt: Timestamp! @default(expr: "request.time")
  lastUpdated: Timestamp! @default(expr: "request.time")
}

# ----------------------------------------------------
# TRAVEL & USER PREFERENCES
# ----------------------------------------------------

type Trip @table {
  id: UUID! @default(expr: "uuidV4()")
  userId: String!
  title: String!
  destination: String
  startDate: String
  endDate: String
  status: String @default(value: "UPCOMING")
  coverImage: String
  createdAt: Timestamp! @default(expr: "request.time")
}

type ItineraryEvent @table {
  id: UUID! @default(expr: "uuidV4()")
  trip: Trip!
  type: String!
  title: String!
  description: String
  eventTime: String
  location: String
  price: Float
  qrData: String
  confirmationCode: String
  createdAt: Timestamp! @default(expr: "request.time")
}

type TravelExpense @table {
  id: UUID! @default(expr: "uuidV4()")
  trip: Trip!
  userId: String!
  amount: Float!
  currency: String @default(value: "USD")
  category: String!
  merchant: String!
  receiptImageUrl: String
  date: String
  items: String
  createdAt: Timestamp! @default(expr: "request.time")
}

type VoiceNote @table {
  id: UUID! @default(expr: "uuidV4()")
  trip: Trip!
  userId: String!
  transcript: String!
  audioUrl: String
  createdAt: Timestamp! @default(expr: "request.time")
}

type PaymentMethod @table {
  id: UUID! @default(expr: "uuidV4()")
  userId: String!
  isDefault: Boolean @default(value: false)
  stripePaymentMethodId: String
  createdAt: Timestamp! @default(expr: "request.time")
}

type UserSubscription @table(key: "userId") {
  userId: String!
  tier: String @default(value: "VIP Member")
  status: String @default(value: "active")
  currentPeriodEnd: String
  stripeSubscriptionId: String
  updatedAt: Timestamp! @default(expr: "request.time")
}

type UserPreference @table(key: "userId") {
  userId: String!
  theme: String @default(value: "dark")
  pushNotifications: Boolean @default(value: true)
  emailAlerts: Boolean @default(value: true)
  updatedAt: Timestamp! @default(expr: "request.time")
}

# ----------------------------------------------------
# CREATORS DOMAIN
# ----------------------------------------------------

type CreatorAgent @table {
  id: UUID! @default(expr: "uuidV4()")
  title: String!
  badge: String
  subtitle: String!
  iconName: String!
  capabilities: String! 
  createdAt: Timestamp! @default(expr: "request.time")
}

type AgentQuickPrompt @table {
  id: UUID! @default(expr: "uuidV4()")
  agent: CreatorAgent!
  label: String!
  prompt: String!
}

type CreativeTemplate @table {
  id: UUID! @default(expr: "uuidV4()")
  name: String!
  creator: String!
  category: String!
  description: String
  iconName: String!
  promptExample: String
  createdAt: Timestamp! @default(expr: "request.time")
}

# ----------------------------------------------------
# WARDROBE DOMAIN
# ----------------------------------------------------

type WardrobeOutfit @table {
  id: UUID! @default(expr: "uuidV4()")
  userId: String!
  title: String!
  description: String
  imageUrl: String
  createdAt: Timestamp! @default(expr: "request.time")
}

type WardrobeItem @table {
  id: UUID! @default(expr: "uuidV4()")
  userId: String!
  outfit: WardrobeOutfit
  category: String!
  brand: String
  imageUrl: String!
  color: String
  createdAt: Timestamp! @default(expr: "request.time")
}

# ----------------------------------------------------
# VISION & ONBOARDING
# ----------------------------------------------------

type VisionHistory @table {
  id: UUID! @default(expr: "uuidV4()")
  userId: String!
  detectedObjects: String!
  context: String
  imageUrl: String
  createdAt: Timestamp! @default(expr: "request.time")
}

type OnboardingStatus @table(key: "userId") {
  userId: String!
  currentStep: Int! @default(value: 0)
  isCompleted: Boolean! @default(value: false)
  updatedAt: Timestamp! @default(expr: "request.time")
}

type CoinbaseWallet @table(key: "userId") {
  userId: String!
  walletAddress: String!
  chainType: String! @default(value: "base")
  createdAt: Timestamp! @default(expr: "request.time")
}
