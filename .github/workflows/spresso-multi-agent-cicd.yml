name: Spresso Multi-Agent CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 1. Dependency Checks & Build
      - name: Build and Check
        id: build
        run: ./gradlew build --continue > build_log.txt 2>&1
        continue-on-error: true

      # 3. Build Full APK (High Autonomy Success)
      - name: Build Full APK
        if: steps.build.outcome == 'success'
        run: ./gradlew assembleDebug

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: spresso-app
          path: app/build/outputs/apk/debug/*.apk
