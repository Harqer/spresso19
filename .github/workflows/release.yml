name: App Release & Canary Deployment

on:
  push:
    tags:
      - 'v*' # Trigger on version tags e.g., v1.0.0

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Run Unit Tests (Gatekeeper)
        run: ./gradlew :composeApp:testDebugUnitTest

      - name: Decode Keystore and Play Console Secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PLAY_JSON_B64: ${{ secrets.PLAY_CONFIG_JSON_B64 }}
        run: |
          # Inject secrets securely at runtime
          echo $KEYSTORE_B64 | base64 --decode > composeApp/release.jks
          echo $PLAY_JSON_B64 | base64 --decode > play_config.json

      - name: Execute Fastlane Canary Deployment
        env:
          PLAY_CONFIG_JSON_PATH: "play_config.json"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gem install fastlane
          fastlane android deploy_internal
