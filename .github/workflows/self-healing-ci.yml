name: Self-Healing CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript & Build
        id: build_step
        run: |
          npm run lint
          npm run build
        continue-on-error: true

      - name: Setup Python for Auto-Fixer
        if: steps.build_step.outcome == 'failure'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Auto-Fix Dependencies
        if: steps.build_step.outcome == 'failure'
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai

      - name: Execute Self-Healing Auto-Fix Agent
        if: steps.build_step.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python .github/scripts/self_healing_agent.py
          
      - name: Fail CI if Auto-Fix failed
        if: steps.build_step.outcome == 'failure'
        run: |
          echo "Build failed. Auto-fix agent was invoked. Checking if fix succeeded..."
          # In a real setup, we verify if the fix worked. For now, exit 1 to keep CI red until it heals.
          exit 1
