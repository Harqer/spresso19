name: CI Auto-Fix Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Lightweight Kotlin Verification (No APK)
        id: build_step
        run: |
          chmod +x ./gradlew
          # Run lightweight checks: linting and compiling tests instead of full APK assembly
          ./gradlew lint compileDebugKotlin --no-daemon 2>&1 | tee build_log.txt
        continue-on-error: true

      - name: Fail CI if build failed
        if: steps.build_step.outcome == 'failure'
        run: |
          echo "Verification failed. Please check the build logs."
          exit 1
