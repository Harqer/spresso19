name: CI Auto-Fix Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Lightweight Kotlin Verification (No APK)
        id: build_step
        run: |
          chmod +x ./gradlew
          # Run lightweight checks: linting and compiling tests instead of full APK assembly
          ./gradlew lint compileDebugKotlin --no-daemon
        continue-on-error: true

      - name: Setup Python for Auto-Fixer
        if: steps.build_step.outcome == 'failure'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Auto-Fix Dependencies
        if: steps.build_step.outcome == 'failure'
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai

      - name: Execute Self-Healing Auto-Fix Agent
        if: steps.build_step.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python .github/scripts/self_healing_agent.py
          
      - name: Fail CI if Auto-Fix failed
        if: steps.build_step.outcome == 'failure'
        run: |
          echo "Verification failed. Auto-fix agent was invoked to repair the codebase."
          # Fail the build so the user knows it was broken (silent success policy).
          exit 1
