name: Automated Security Audit & Auto-Fix

on:
  schedule:
    # Run every night at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  autofix-vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Security Fixes
        run: |
          npm audit fix --force || true
          npm install

      - name: Validate Build Integrity
        run: npm run build

      - name: Commit and Push Security Fixes
        run: |
          git config user.name "Spresso Security Bot"
          git config user.email "security-bot@spresso.ai"
          if [[ -n $(git status --porcelain) ]]; then
            git add package.json package-lock.json
            git commit -m "security(autofix): Automatically patch Dependabot vulnerabilities via CI/CD security bot"
            git push origin main
          else
            echo "No vulnerabilities requiring auto-patching."
          fi
