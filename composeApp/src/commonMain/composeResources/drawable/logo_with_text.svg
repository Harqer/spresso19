<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90" fill="none">
  <!-- Terracotta Icon Group -->
  <g transform="translate(12, 5)">
    <!-- Shopping Bag Handle -->
    <path
      d="M 24 24 C 24 12, 56 12, 56 24"
      stroke="#AC533B"
      stroke-width="5"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Main Bag Body Outline -->
    <path
      d="M 20 24 H 60 C 64 24 67 27 66 31 L 63 60 C 62 65 58 68 53 68 H 27 C 22 68 18 65 17 60 L 14 31 C 13 27 16 24 20 24 Z"
      stroke="#AC533B"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <!-- S-Curve Fold -->
    <path
      d="M 25 36 C 35 34, 55 36, 55 44 C 55 52, 34 53, 27 55 C 20 57, 22 68 34 68 H 55"
      stroke="#AC533B"
      stroke-width="4.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <!-- Green Organic Leaf Accent -->
    <g transform="translate(50, 26) rotate(-15)">
      <path
        d="M 0 12 C -2 -3 14 -9 18 0 C 20 12 4 16 0 12 Z"
        fill="#437A4B"
      />
      <path
        d="M 2 10 C 6 6 11 3 15 2"
        stroke="#68A571"
        stroke-width="1.2"
        stroke-linecap="round"
      />
    </g>
  </g>
  <!-- Wordmark: spresso -->
  <text x="96" y="48" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="38" letter-spacing="-1.2px" fill="#17221C">spresso</text>
  <!-- Subtitle: SHOP SMARTER -->
  <text x="98" y="68" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="11" letter-spacing="3.2px" fill="#AC533B">SHOP SMARTER</text>
</svg>

