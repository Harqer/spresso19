# NVIDIA NemoClaw/OpenShell policy source.
# Schema and baseline entries verified against NVIDIA's published
# nemoclaw-blueprint/policies/openclaw-sandbox.yaml.
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
    - /var/lib/dpkg
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
    - /dev/pts
    - /sandbox/.openclaw
    - /sandbox/.nemoclaw
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  nvidia:
    name: nvidia
    endpoints:
      - host: integrate.api.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: POST, path: "/v1/chat/completions"}
          - allow: {method: POST, path: "/v1/completions"}
          - allow: {method: POST, path: "/v1/embeddings"}
          - allow: {method: GET, path: "/v1/models"}
          - allow: {method: GET, path: "/v1/models/**"}
        binaries:
          - {path: /usr/local/bin/openclaw}
  managed_inference:
    name: managed_inference
    endpoints:
      - host: inference.local
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: "/**"}
          - allow: {method: POST, path: "/**"}
        binaries:
          - {path: /usr/local/bin/openclaw}
          - {path: /usr/local/bin/node}
  clawhub:
    name: clawhub
    endpoints:
      - host: clawhub.ai
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: "/**"}
          - allow: {method: POST, path: "/**"}
        binaries:
          - {path: /usr/local/bin/openclaw}
          - {path: /usr/local/bin/node}
  openclaw_api:
    name: openclaw_api
    endpoints:
      - host: openclaw.ai
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: "/**"}
          - allow: {method: POST, path: "/**"}
        binaries:
          - {path: /usr/local/bin/openclaw}
          - {path: /usr/local/bin/node}
  openclaw_docs:
    name: openclaw_docs
    endpoints:
      - host: docs.openclaw.ai
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: "/**"}
        binaries:
          - {path: /usr/local/bin/openclaw}
  npm_registry:
    name: npm_registry
    endpoints:
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: "/**"}
        binaries:
          - {path: /usr/local/bin/openclaw}
