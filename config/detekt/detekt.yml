complexity:
  LongMethod:
    active: true
    allowedLines: 750
  LongParameterList:
    active: true
    allowedFunctionParameters: 26
    allowedConstructorParameters: 16
    ignoreDefaultParameters: true
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 50
  LargeClass:
    active: true
    allowedLines: 1200
  NestedBlockDepth:
    active: true
    allowedDepth: 6

naming:
  FunctionNaming:
    active: true
    # Composable functions follow PascalCase by convention.
    ignoreAnnotated: ['Composable']
  MatchingDeclarationName:
    active: false
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Za-z][_A-Za-z0-9]*'

style:
  MaxLineLength:
    active: true
    maxLineLength: 170
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: false
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  UnusedPrivateClass:
    active: true
  UnusedPrivateFunction:
    active: true
  UnusedPrivateProperty:
    active: true
  UnusedParameter:
    active: true
    allowedNames: '^(ignored|expected|_|vars)$'
  LoopWithTooManyJumpStatements:
    active: false
  WildcardImport:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
